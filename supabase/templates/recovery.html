<!doctype html>
<html lang="en">
  <body style="margin: 0; background: #050816; color: #f8fafc; font-family: Arial, sans-serif">
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background: #050816"
    >
      <tr>
        <td align="center" style="padding: 40px 16px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 560px;
              border: 1px solid #29304d;
              border-radius: 20px;
              background: #080e1c;
            "
          >
            <tr>
              <td style="padding: 36px">
                <p
                  style="
                    margin: 0 0 12px;
                    color: #c4b5fd;
                    font-size: 12px;
                    font-weight: 700;
                    letter-spacing: 1.4px;
                    text-transform: uppercase;
                  "
                >
                  Password recovery
                </p>
                <h1 style="margin: 0; color: #fff; font-size: 28px; line-height: 36px">
                  Set a new password.
                </h1>
                <p style="margin: 16px 0 26px; color: #d6d9e7; font-size: 16px; line-height: 26px">
                  We received a request to reset the password for your AcadeMY account.
                </p>
                <a
                  href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/auth/reset-password"
                  style="
                    display: inline-block;
                    border-radius: 14px;
                    background: #6366f1;
                    padding: 14px 22px;
                    color: #fff;
                    font-size: 15px;
                    font-weight: 700;
                    text-decoration: none;
                  "
                  >Reset password</a
                >
                <p style="margin: 26px 0 0; color: #9299b1; font-size: 13px; line-height: 21px">
                  If you did not request a password reset, you can safely ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
