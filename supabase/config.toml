[auth]
site_url = "https://www.myacademy.my"
additional_redirect_urls = [
  "https://www.myacademy.my/login",
  "https://www.myacademy.my/auth/callback",
  "https://www.myacademy.my/auth/callback?next=%2Fadmin%2Flogin",
  "https://www.myacademy.my/auth/callback?next=%2Fupgrade",
  "https://www.myacademy.my/auth/reset-password",
  "http://localhost:8080",
  "http://localhost:8080/auth/callback",
  "http://localhost:8080/auth/reset-password",
  "https://www.myacademy.my",
  "https://partners.myacademy.my",
  "https://partners.myacademy.my/**",
]
enable_anonymous_sign_ins = true

[auth.email]
enable_confirmations = false
max_frequency = "1m"
otp_length = 8

[auth.email.template.recovery]
subject = "Reset your AcadeMY password"
content_path = "./supabase/templates/recovery.html"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.hook.send_email]
enabled = true
uri = "https://aojrbxoqbgyxmfljqpqj.supabase.co/functions/v1/send-auth-email"
secrets = "env(SEND_EMAIL_HOOK_SECRET)"

[functions.send-auth-email]
verify_jwt = false

[functions.send-invoice-email]
verify_jwt = true

[functions.send-parent-report]
verify_jwt = true

[functions.create-toyyibpay-bill]
verify_jwt = true

[functions.get-invoice-download-url]
verify_jwt = true

[functions.toyyibpay-callback]
verify_jwt = false

[storage.vector]
enabled = false
