name: Diagnose Form 1 Maths Chapter 8 build
on:
  push:
    branches:
      - fix/math-f1-ch8-selective-quiz-visuals
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript validation (known baseline science test errors non-blocking)
        continue-on-error: true
        run: npx tsc --noEmit
      - name: Run Chapter 8 visual regression tests
        run: npx vitest run src/content/form1/math/chapter-8/quiz-visuals.test.tsx
      - name: Verify production build
        run: npm run build
