name: Temporary Chapter 13 Maths Visual Verification
on:
  push:
    branches:
      - fix/math-f1-ch13-selective-quiz-visuals
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Chapter 13 visual regression tests
        run: npx vitest run src/content/form1/math/chapter-13/quiz-visuals.test.tsx
      - name: TypeScript diagnostics
        run: npx tsc --noEmit --pretty false
        continue-on-error: true
      - name: Production build
        run: npm run build
