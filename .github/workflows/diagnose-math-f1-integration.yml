name: Diagnose Maths Form 1 Chapter 2-8 Integration
on:
  push:
    branches:
      - integration/math-f1-ch4-ch8-selective-quiz-visuals
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript diagnostics (known baseline Science F2 test errors non-blocking)
        continue-on-error: true
        run: npx tsc --noEmit
      - name: Run Maths F1 Chapter 2-8 visual regression tests
        run: npx vitest run src/content/form1/math/chapter-{2,3,4,5,6,7,8}/quiz-visuals.test.tsx
      - name: Verify production build
        run: npm run build
