name: Temporary Form 1 Mathematics Whole-Subject Audit
on:
  push:
    branches:
      - audit/math-f1-all-chapters-20261010
  workflow_dispatch:
jobs:
  mathematics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependency versions
        run: npm ci
      - name: Full Form 1 Mathematics audit tests
        run: npx vitest run src/content/form1/math
      - name: Form 1 Maths content and routing smoke tests
        run: npx vitest run src/content/notes-loading.test.tsx src/content/registry.science-notes-navigation.test.ts
