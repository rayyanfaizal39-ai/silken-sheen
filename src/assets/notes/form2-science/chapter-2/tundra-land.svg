<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" width="700" height="460" role="img" aria-label="Tundra land biome: treeless plain with mosses, lichens and dwarf shrubs over frozen rocky ground, low hills behind, an arctic fox and a ptarmigan">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8FA9C9"/>
      <stop offset="55%" stop-color="#C6D3E0"/>
      <stop offset="100%" stop-color="#E4DCCC"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9AA6AE"/>
      <stop offset="100%" stop-color="#7C8891"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B7F6A"/>
      <stop offset="100%" stop-color="#6E6553"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#938A63"/>
      <stop offset="45%" stop-color="#7E7A52"/>
      <stop offset="100%" stop-color="#5F6142"/>
    </linearGradient>
  </defs>

  <rect width="700" height="460" fill="url(#sky)"/>

  <!-- low, treeless hills: tundra horizon -->
  <path d="M0 196 L88 168 L166 190 L250 160 L338 188 L420 166 L512 192 L596 172 L700 196 L700 240 L0 240 Z" fill="url(#hillFar)"/>
  <path d="M0 224 L96 206 L190 226 L286 204 L392 228 L486 210 L586 230 L700 212 L700 268 L0 268 Z" fill="url(#hillNear)"/>
  <!-- patches of lingering snow on the hills, not sea ice -->
  <path d="M232 168 L262 176 L236 182 Z" fill="#E8EEF2" opacity="0.85"/>
  <path d="M486 214 L520 222 L492 228 Z" fill="#E8EEF2" opacity="0.7"/>
  <path d="M78 176 L104 183 L82 188 Z" fill="#E8EEF2" opacity="0.7"/>

  <!-- frozen, rocky ground plain -->
  <rect x="0" y="262" width="700" height="198" fill="url(#ground)"/>
  <!-- permafrost polygon cracks: the patterned ground typical of tundra -->
  <g stroke="#4E5138" stroke-width="1.4" opacity="0.5" fill="none">
    <path d="M0 300 L120 292 L240 306 L366 294 L492 308 L620 296 L700 306"/>
    <path d="M0 352 L112 344 L236 358 L358 346 L486 360 L610 348 L700 358"/>
    <path d="M120 292 L112 344"/><path d="M240 306 L236 358"/>
    <path d="M366 294 L358 346"/><path d="M492 308 L486 360"/>
    <path d="M620 296 L610 348"/>
    <path d="M60 352 L54 412"/><path d="M300 358 L292 420"/><path d="M540 360 L548 418"/>
  </g>

  <!-- scattered rocks -->
  <g fill="#6B6A5B">
    <ellipse cx="96" cy="330" rx="20" ry="10"/>
    <ellipse cx="612" cy="344" rx="24" ry="11"/>
    <ellipse cx="404" cy="392" rx="17" ry="8"/>
    <ellipse cx="188" cy="412" rx="22" ry="10"/>
  </g>
  <g fill="#82806F">
    <ellipse cx="92" cy="326" rx="13" ry="6"/>
    <ellipse cx="606" cy="340" rx="15" ry="7"/>
  </g>

  <!-- lichen crusts on the rocks -->
  <g fill="#C9CF6B" opacity="0.85">
    <circle cx="88" cy="325" r="3.4"/><circle cx="99" cy="329" r="2.4"/>
    <circle cx="601" cy="339" r="3.2"/><circle cx="614" cy="343" r="2.6"/>
    <circle cx="401" cy="390" r="2.6"/>
  </g>

  <!-- moss cushions -->
  <g>
    <ellipse cx="150" cy="318" rx="28" ry="11" fill="#6E8A4A"/>
    <ellipse cx="150" cy="315" rx="20" ry="8" fill="#89A85C"/>
    <ellipse cx="500" cy="376" rx="34" ry="13" fill="#6E8A4A"/>
    <ellipse cx="500" cy="372" rx="24" ry="9" fill="#89A85C"/>
    <ellipse cx="286" cy="436" rx="40" ry="14" fill="#6E8A4A"/>
    <ellipse cx="286" cy="432" rx="28" ry="10" fill="#89A85C"/>
  </g>

  <!-- dwarf shrubs: woody but only ankle-high, never trees -->
  <g stroke="#5A4632" stroke-width="2.6" fill="none" stroke-linecap="round">
    <path d="M330 342 L330 322 M330 330 L322 320 M330 330 L339 321"/>
    <path d="M356 348 L356 330 M356 337 L348 328 M356 337 L365 329"/>
    <path d="M646 402 L646 380 M646 388 L637 378 M646 388 L656 379"/>
  </g>
  <g fill="#9C5B4A">
    <circle cx="322" cy="318" r="4"/><circle cx="340" cy="319" r="4"/><circle cx="330" cy="320" r="3.4"/>
    <circle cx="348" cy="326" r="4"/><circle cx="366" cy="327" r="4"/>
    <circle cx="637" cy="376" r="4.2"/><circle cx="657" cy="377" r="4.2"/>
  </g>
  <g fill="#7E9B52">
    <ellipse cx="326" cy="330" rx="7" ry="3.4"/><ellipse cx="336" cy="333" rx="6" ry="3"/>
    <ellipse cx="352" cy="338" rx="7" ry="3.4"/><ellipse cx="362" cy="341" rx="6" ry="3"/>
    <ellipse cx="641" cy="388" rx="8" ry="3.6"/><ellipse cx="653" cy="391" rx="7" ry="3.2"/>
  </g>

  <!-- cotton grass tufts -->
  <g stroke="#8E8A5E" stroke-width="1.6" fill="none">
    <path d="M60 372 L58 344"/><path d="M68 374 L70 348"/><path d="M76 372 L80 350"/>
    <path d="M556 330 L554 306"/><path d="M564 332 L566 310"/>
  </g>
  <g fill="#F2EEE2">
    <circle cx="58" cy="341" r="5"/><circle cx="70" cy="345" r="4.6"/><circle cx="80" cy="347" r="4.2"/>
    <circle cx="554" cy="303" r="4.6"/><circle cx="566" cy="307" r="4.2"/>
  </g>

  <!-- arctic fox: a tundra land mammal, thick winter coat, short ears -->
  <g transform="translate(196 330)">
    <ellipse cx="34" cy="30" rx="34" ry="18" fill="#F0F2F4"/>
    <ellipse cx="34" cy="26" rx="30" ry="14" fill="#FBFCFD"/>
    <path d="M2 30 q-24 -4 -30 -18 q16 -2 26 6 q4 6 4 12 Z" fill="#F0F2F4"/>
    <circle cx="62" cy="16" r="14" fill="#FBFCFD"/>
    <path d="M53 6 l-3 -11 l11 5 Z" fill="#F0F2F4"/>
    <path d="M69 5 l4 -10 l6 9 Z" fill="#F0F2F4"/>
    <circle cx="58" cy="15" r="1.9" fill="#3B3F45"/>
    <circle cx="68" cy="15" r="1.9" fill="#3B3F45"/>
    <ellipse cx="74" cy="19" rx="3.2" ry="2.4" fill="#3B3F45"/>
    <g stroke="#E2E6EA" stroke-width="5" stroke-linecap="round">
      <path d="M20 44 L18 54"/><path d="M34 46 L34 56"/><path d="M48 44 L50 54"/>
    </g>
  </g>

  <!-- ptarmigan: ground bird of the tundra -->
  <g transform="translate(470 300)">
    <ellipse cx="22" cy="20" rx="21" ry="14" fill="#F4F2EC"/>
    <ellipse cx="22" cy="18" rx="15" ry="9" fill="#FDFBF6"/>
    <circle cx="40" cy="10" r="8.4" fill="#FDFBF6"/>
    <circle cx="43" cy="8" r="1.6" fill="#3B3F45"/>
    <path d="M48 10 l7 3 l-7 3 Z" fill="#C79A3E"/>
    <path d="M8 18 q-10 4 -14 -2 q8 -4 14 -2 Z" fill="#E7E3D8"/>
    <path d="M14 26 q10 8 22 4" stroke="#C9C4B2" stroke-width="1.6" fill="none"/>
    <g stroke="#C79A3E" stroke-width="2.6" stroke-linecap="round">
      <path d="M18 34 L17 42"/><path d="M28 34 L29 42"/>
    </g>
    <circle cx="44" cy="4" r="2.6" fill="#C0392B"/>
  </g>

</svg>
