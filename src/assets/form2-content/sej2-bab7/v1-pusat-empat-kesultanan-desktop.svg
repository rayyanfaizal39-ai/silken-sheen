<text x="810" y="158" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#f59e0b">Pahang — 1470</text>
<text x="810" y="192" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">Raja Muhammad (Sultan Muhammad Shah) dari</text>
<text x="810" y="222" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">Melaka; pusat di Pekan, berhampiran Kuala</text>
<text x="810" y="252" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">Sungai Pahang.</text>
<circle cx="782" cy="286" r="17" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/><text x="782" y="294" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">2</text>
<text x="810" y="296" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#38bdf8">Perak — 1528</text>
<text x="810" y="330" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">Raja Muzaffar (Sultan Muzaffar Shah) dari</text>
<text x="810" y="360" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">Kampar; pusat di Tanah Abang, pesisir Sungai</text>
