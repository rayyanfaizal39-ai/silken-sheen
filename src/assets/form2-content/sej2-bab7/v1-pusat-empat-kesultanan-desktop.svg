<circle cx="782" cy="424" r="17" fill="#0f172a" stroke="#34d399" stroke-width="2.5"/><text x="782" y="432" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">3</text>
<text x="810" y="434" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#34d399">Terengganu — 1708</text>
<text x="810" y="468" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">Tun Zainal Abidin (Sultan Zainal Abidin I),</text>
<text x="810" y="498" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">diiringi keluarga Patani; pusat di Tanjung</text>
<text x="810" y="528" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">Baru, Kuala Berang.</text>
<circle cx="782" cy="562" r="17" fill="#0f172a" stroke="#fb7185" stroke-width="2.5"/><text x="782" y="570" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">4</text>
<text x="810" y="572" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#fb7185">Selangor — 1766</text>
<text x="810" y="606" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">Raja Lumu (Sultan Salehuddin Shah) ditabalkan</text>
<text x="810" y="636" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">oleh Sultan Perak; pusat di Kuala Selangor.</text>
