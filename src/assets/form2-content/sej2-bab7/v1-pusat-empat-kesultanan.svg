<text x="74" y="1403" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#f59e0b">Pahang — 1470</text>
<text x="74" y="1445" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#cbd5e1">Raja Muhammad (Sultan Muhammad Shah)</text>
<text x="74" y="1485" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#cbd5e1">dari Melaka; pusat di Pekan,</text>
<text x="74" y="1525" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#cbd5e1">berhampiran Kuala Sungai Pahang.</text>
<circle cx="46" cy="1565" r="21" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/><text x="46" y="1576" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#f1f5f9">2</text>
<text x="74" y="1575" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#38bdf8">Perak — 1528</text>
<text x="74" y="1617" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#cbd5e1">Raja Muzaffar (Sultan Muzaffar Shah)</text>
<text x="74" y="1657" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#cbd5e1">dari Kampar; pusat di Tanah Abang,</text>
<text x="74" y="1697" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#cbd5e1">pesisir Sungai Perak.</text>
<circle cx="46" cy="1737" r="21" fill="#0f172a" stroke="#34d399" stroke-width="2.5"/><text x="46" y="1748" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#f1f5f9">3</text>
<text x="74" y="1747" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#34d399">Terengganu — 1708</text>
<text x="74" y="1789" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#cbd5e1">Tun Zainal Abidin (Sultan Zainal</text>
<text x="74" y="1829" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#cbd5e1">Abidin I), diiringi keluarga Patani;</text>
<text x="74" y="1869" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#cbd5e1">pusat di Tanjung Baru, Kuala Berang.</text>
<circle cx="46" cy="1909" r="21" fill="#0f172a" stroke="#fb7185" stroke-width="2.5"/><text x="46" y="1920" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#f1f5f9">4</text>
<text x="74" y="1919" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#fb7185">Selangor — 1766</text>
<text x="74" y="1961" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#cbd5e1">Raja Lumu (Sultan Salehuddin Shah)</text>
<text x="74" y="2001" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#cbd5e1">ditabalkan oleh Sultan Perak; pusat di</text>
<text x="74" y="2041" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#cbd5e1">Kuala Selangor.</text>
