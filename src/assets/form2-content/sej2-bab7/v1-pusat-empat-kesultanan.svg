<text x="74" y="1226" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#f59e0b">Pahang — 1470</text>
<text x="74" y="1260" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">Raja Muhammad (Sultan Muhammad Shah) dari Melaka; pusat</text>
<text x="74" y="1290" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">di Pekan, berhampiran Kuala Sungai Pahang.</text>
<circle cx="46" cy="1324" r="17" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/><text x="46" y="1332" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">2</text>
<text x="74" y="1334" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#38bdf8">Perak — 1528</text>
<text x="74" y="1368" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">Raja Muzaffar (Sultan Muzaffar Shah) dari Kampar; pusat</text>
<text x="74" y="1398" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">di Tanah Abang, pesisir Sungai Perak.</text>
<circle cx="46" cy="1432" r="17" fill="#0f172a" stroke="#34d399" stroke-width="2.5"/><text x="46" y="1440" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">3</text>
<text x="74" y="1442" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#34d399">Terengganu — 1708</text>
<text x="74" y="1476" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">Tun Zainal Abidin (Sultan Zainal Abidin I), diiringi</text>
<text x="74" y="1506" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">keluarga Patani; pusat di Tanjung Baru, Kuala Berang.</text>
<circle cx="46" cy="1540" r="17" fill="#0f172a" stroke="#fb7185" stroke-width="2.5"/><text x="46" y="1548" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">4</text>
<text x="74" y="1550" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#fb7185">Selangor — 1766</text>
<text x="74" y="1584" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">Raja Lumu (Sultan Salehuddin Shah) ditabalkan oleh</text>
<text x="74" y="1614" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">Sultan Perak; pusat di Kuala Selangor.</text>
