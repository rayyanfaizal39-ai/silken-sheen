<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 804" width="1400" height="804" role="img" aria-label="Rajah utusan kerajaan Alam Melayu ke China dan India">
<title>Hubungan Diplomatik: Utusan ke China dan India</title>
<metadata>Rajah konseptual. Sumber: buku teks hlm. 18-19.</metadata>
<rect width="1400" height="804" rx="20" fill="#0f172a"/>
<text x="700" y="68" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#f1f5f9">Hubungan Diplomatik: Utusan ke China dan India</text>
<rect x="660" y="98" width="80" height="5" rx="2.5" fill="#38bdf8"/>
<rect x="232" y="130" width="558" height="48" rx="24" fill="#f87171"/><text x="511" y="163" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" fill="#0f172a">Ke CHINA</text>
<rect x="814" y="130" width="558" height="48" rx="24" fill="#fbbf24"/><text x="1093" y="163" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" fill="#0f172a">Ke INDIA</text>
<rect x="28" y="190" width="180" height="82" rx="12" fill="#162033" stroke="#f59e0b" stroke-width="2"/><text x="48" y="241" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#f59e0b">Funan</text>
<rect x="232" y="190" width="558" height="82" rx="12" fill="#162033" stroke="#334155" stroke-width="2"/>
<text x="248" y="224" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" fill="#f1f5f9"><tspan font-weight="700" fill="#94a3b8">abad ketiga:</tspan> Memohon bantuan ketenteraan</text>
<text x="248" y="254" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#f1f5f9">untuk melawan Dai Viet.</text>
<rect x="814" y="190" width="558" height="82" rx="12" fill="#162033" stroke="#334155" stroke-width="2"/>
<text x="830" y="224" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" fill="#f1f5f9"><tspan font-weight="700" fill="#94a3b8">abad ketiga:</tspan> Memperkukuh hubungan</text>
<text x="830" y="254" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#f1f5f9">perdagangan dan keagamaan dengan India.</text>
<rect x="28" y="280" width="180" height="112" rx="12" fill="#162033" stroke="#f472b6" stroke-width="2"/><text x="48" y="346" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#f472b6">Champa</text>
<rect x="232" y="280" width="558" height="112" rx="12" fill="#162033" stroke="#334155" stroke-width="2"/>
<text x="248" y="314" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" fill="#f1f5f9"><tspan font-weight="700" fill="#94a3b8">abad ketiga:</tspan> Memulihkan hubungan setelah</text>
<text x="248" y="344" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#f1f5f9">berperang dengan sekutu China, iaitu Dai</text>
<text x="248" y="374" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#f1f5f9">Viet.</text>
<rect x="814" y="280" width="558" height="112" rx="12" fill="#162033" stroke="#334155" stroke-width="2"/>
<text x="830" y="316" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" fill="#94a3b8">—</text>
<rect x="28" y="400" width="180" height="112" rx="12" fill="#162033" stroke="#34d399" stroke-width="2"/><text x="48" y="466" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#34d399">Srivijaya</text>
<rect x="232" y="400" width="558" height="112" rx="12" fill="#162033" stroke="#334155" stroke-width="2"/>
<text x="248" y="434" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" fill="#f1f5f9"><tspan font-weight="700" fill="#94a3b8">abad ketujuh:</tspan> Mendapatkan pengiktirafan</text>
<text x="248" y="464" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#f1f5f9">dan memperkukuh hubungan persahabatan dan</text>
<text x="248" y="494" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#f1f5f9">perdagangan.</text>
<rect x="814" y="400" width="558" height="112" rx="12" fill="#162033" stroke="#334155" stroke-width="2"/>
<text x="830" y="434" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" fill="#f1f5f9"><tspan font-weight="700" fill="#94a3b8">abad kesembilan:</tspan> Mengeratkan hubungan</text>
<text x="830" y="464" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#f1f5f9">persahabatan dan hubungan keagamaan.</text>
<rect x="28" y="520" width="180" height="82" rx="12" fill="#162033" stroke="#38bdf8" stroke-width="2"/><text x="48" y="571" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#38bdf8">Kedah Tua</text>
<rect x="232" y="520" width="558" height="82" rx="12" fill="#162033" stroke="#334155" stroke-width="2"/>
<text x="248" y="554" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" fill="#f1f5f9"><tspan font-weight="700" fill="#94a3b8">abad ketujuh:</tspan> Memperkukuh hubungan</text>
<text x="248" y="584" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#f1f5f9">perdagangan.</text>
<rect x="814" y="520" width="558" height="82" rx="12" fill="#162033" stroke="#334155" stroke-width="2"/>
<text x="830" y="556" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" fill="#94a3b8">—</text>
<rect x="28" y="610" width="180" height="82" rx="12" fill="#162033" stroke="#a78bfa" stroke-width="2"/><text x="48" y="661" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#a78bfa">Angkor</text>
<rect x="232" y="610" width="558" height="82" rx="12" fill="#162033" stroke="#334155" stroke-width="2"/>
<text x="248" y="644" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" fill="#f1f5f9"><tspan font-weight="700" fill="#94a3b8">abad ke-12:</tspan> Memperkukuh persahabatan dan</text>
<text x="248" y="674" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#f1f5f9">perdagangan.</text>
<rect x="814" y="610" width="558" height="82" rx="12" fill="#162033" stroke="#334155" stroke-width="2"/>
<text x="830" y="644" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" fill="#f1f5f9"><tspan font-weight="700" fill="#94a3b8">abad ke-12:</tspan> Mengeratkan hubungan</text>
<text x="830" y="674" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#f1f5f9">persahabatan.</text>
<rect x="28" y="700" width="180" height="82" rx="12" fill="#162033" stroke="#fb7185" stroke-width="2"/><text x="48" y="751" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#fb7185">Majapahit</text>
<rect x="232" y="700" width="558" height="82" rx="12" fill="#162033" stroke="#334155" stroke-width="2"/>
<text x="248" y="734" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" fill="#f1f5f9"><tspan font-weight="700" fill="#94a3b8">abad ke-14:</tspan> Menjalinkan hubungan</text>
<text x="248" y="764" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#f1f5f9">persahabatan.</text>
<rect x="814" y="700" width="558" height="82" rx="12" fill="#162033" stroke="#334155" stroke-width="2"/>
<text x="830" y="734" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" fill="#f1f5f9"><tspan font-weight="700" fill="#94a3b8">abad ke-14:</tspan> Mengeratkan hubungan</text>
<text x="830" y="764" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#f1f5f9">persahabatan.</text>
</svg>
