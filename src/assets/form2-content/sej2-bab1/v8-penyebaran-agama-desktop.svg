<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 392" width="1100" height="392" role="img" aria-label="Cara penyebaran agama Hindu, Buddha dan Islam ke Alam Melayu">
<title>Cara Penyebaran Agama ke Alam Melayu</title>
<metadata>Rajah perbandingan. Sumber: buku teks hlm. 17.</metadata>
<rect width="1100" height="392" rx="20" fill="#0f172a"/>
<text x="550" y="68" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#f1f5f9">Cara Penyebaran Agama ke Alam Melayu</text>
<rect x="510" y="98" width="80" height="5" rx="2.5" fill="#38bdf8"/>
<rect x="28" y="130" width="332" height="240" rx="16" fill="#162033" stroke="#334155" stroke-width="2"/>
<rect x="28" y="130" width="8" height="240" rx="4" fill="#f59e0b"/>
<text x="56" y="176" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#f59e0b">Hindu</text>
<text x="56" y="216" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#cbd5e1">Melalui peranan</text>
<text x="56" y="250" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#cbd5e1">pedagang, tentera</text>
<text x="56" y="284" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#cbd5e1">dan golongan</text>
<text x="56" y="318" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#cbd5e1">Brahmin.</text>
<rect x="384" y="130" width="332" height="240" rx="16" fill="#162033" stroke="#334155" stroke-width="2"/>
<rect x="384" y="130" width="8" height="240" rx="4" fill="#a78bfa"/>
<text x="412" y="176" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#a78bfa">Buddha</text>
<text x="412" y="216" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#cbd5e1">Peranan Asoka,</text>
<text x="412" y="250" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#cbd5e1">pemerintah empayar</text>
<text x="412" y="284" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#cbd5e1">Maurya, menghantar</text>
<text x="412" y="318" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#cbd5e1">sami-sami Buddha ke</text>
<text x="412" y="352" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#cbd5e1">Alam Melayu.</text>
<rect x="740" y="130" width="332" height="240" rx="16" fill="#162033" stroke="#334155" stroke-width="2"/>
<rect x="740" y="130" width="8" height="240" rx="4" fill="#34d399"/>
<text x="768" y="176" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#34d399">Islam</text>
<text x="768" y="216" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#cbd5e1">Melalui peranan</text>
<text x="768" y="250" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#cbd5e1">pedagang,</text>
<text x="768" y="284" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#cbd5e1">pemerintah dan</text>
<text x="768" y="318" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#cbd5e1">pendakwah.</text>
</svg>
