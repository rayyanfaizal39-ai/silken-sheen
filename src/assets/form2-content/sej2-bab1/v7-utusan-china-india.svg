<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1010" width="760" height="1010" role="img" aria-label="Rajah utusan kerajaan Alam Melayu ke China">
<title>Hubungan Diplomatik: Utusan ke China</title>
<metadata>Rajah konseptual. Sumber: buku teks hlm. 18.</metadata>
<rect width="760" height="1010" rx="20" fill="#0f172a"/>
<text x="380" y="68" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#f1f5f9">Hubungan Diplomatik: Utusan ke</text>
<text x="380" y="116" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#f1f5f9">China</text>
<rect x="340" y="146" width="80" height="5" rx="2.5" fill="#38bdf8"/>
<rect x="28" y="178" width="704" height="52" rx="26" fill="#f87171"/><text x="380" y="214" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="800" fill="#0f172a">Utusan ke CHINA · hlm. 18</text>
<rect x="28" y="244" width="704" height="130" rx="16" fill="#162033" stroke="#334155" stroke-width="2"/>
<rect x="28" y="244" width="8" height="130" rx="4" fill="#f59e0b"/>
<text x="56" y="286" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#f59e0b">Funan · abad ketiga</text>
<text x="56" y="322" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">Memohon bantuan ketenteraan untuk melawan Dai</text>
<text x="56" y="354" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">Viet.</text>
<rect x="28" y="384" width="704" height="130" rx="16" fill="#162033" stroke="#334155" stroke-width="2"/>
<rect x="28" y="384" width="8" height="130" rx="4" fill="#f472b6"/>
<text x="56" y="426" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#f472b6">Champa · abad ketiga</text>
<text x="56" y="462" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">Memulihkan hubungan setelah berperang dengan</text>
<text x="56" y="494" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">sekutu China, iaitu Dai Viet.</text>
<rect x="28" y="524" width="704" height="130" rx="16" fill="#162033" stroke="#334155" stroke-width="2"/>
<rect x="28" y="524" width="8" height="130" rx="4" fill="#34d399"/>
<text x="56" y="566" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#34d399">Srivijaya · abad ketujuh</text>
<text x="56" y="602" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">Mendapatkan pengiktirafan dan memperkukuh</text>
<text x="56" y="634" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">hubungan persahabatan dan perdagangan.</text>
<rect x="28" y="664" width="704" height="98" rx="16" fill="#162033" stroke="#334155" stroke-width="2"/>
<rect x="28" y="664" width="8" height="98" rx="4" fill="#38bdf8"/>
<text x="56" y="706" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#38bdf8">Kedah Tua · abad ketujuh</text>
<text x="56" y="742" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">Memperkukuh hubungan perdagangan.</text>
<rect x="28" y="772" width="704" height="98" rx="16" fill="#162033" stroke="#334155" stroke-width="2"/>
<rect x="28" y="772" width="8" height="98" rx="4" fill="#a78bfa"/>
<text x="56" y="814" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#a78bfa">Angkor · abad ke-12</text>
<text x="56" y="850" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">Memperkukuh persahabatan dan perdagangan.</text>
<rect x="28" y="880" width="704" height="98" rx="16" fill="#162033" stroke="#334155" stroke-width="2"/>
<rect x="28" y="880" width="8" height="98" rx="4" fill="#fb7185"/>
<text x="56" y="922" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#fb7185">Majapahit · abad ke-14</text>
<text x="56" y="958" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">Menjalinkan hubungan persahabatan.</text>
</svg>
