<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 722" width="1400" height="722" role="img" aria-label="Perbandingan pandangan lima tokoh tentang kawasan Alam Melayu">
<title>Pandangan Lima Tokoh tentang Kawasan Alam Melayu</title>
<metadata>Rajah perbandingan. Sumber: buku teks hlm. 4-5.</metadata>
<rect width="1400" height="722" rx="20" fill="#0f172a"/>
<text x="700" y="68" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#f1f5f9">Pandangan Lima Tokoh tentang Kawasan Alam Melayu</text>
<rect x="660" y="98" width="80" height="5" rx="2.5" fill="#38bdf8"/>
<rect x="28" y="130" width="432" height="322" rx="16" fill="#162033" stroke="#334155" stroke-width="2"/>
<rect x="28" y="130" width="8" height="322" rx="4" fill="#38bdf8"/>
<text x="56" y="172" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#38bdf8">Nik Hassan Shuhaimi Nik</text>
<text x="56" y="206" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#38bdf8">Abdul Rahman</text>
<text x="56" y="236" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">Ahli arkeologi</text>
<text x="56" y="272" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">Alam Melayu meliputi</text>
<text x="56" y="304" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">kawasan dari Madagaskar ke</text>
<text x="56" y="336" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">Tanah Melayu, Papua New</text>
<text x="56" y="368" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">Guinea, Australia, New</text>
<text x="56" y="400" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">Zealand, Kepulauan Pasifik</text>
<text x="56" y="432" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">dan sampai ke Taiwan.</text>
<rect x="484" y="130" width="432" height="322" rx="16" fill="#162033" stroke="#334155" stroke-width="2"/>
<rect x="484" y="130" width="8" height="322" rx="4" fill="#34d399"/>
<text x="512" y="172" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#34d399">Abdul Hadi Haji Hassan</text>
<text x="512" y="202" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">Ahli akademik</text>
<text x="512" y="238" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">Alam Melayu merupakan suatu</text>
<text x="512" y="270" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">lingkungan geografi yang</text>
<text x="512" y="302" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">luas meliputi Kepulauan</text>
<text x="512" y="334" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">Melayu hingga selatan</text>
<text x="512" y="366" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">Thailand.</text>
<rect x="940" y="130" width="432" height="322" rx="16" fill="#162033" stroke="#334155" stroke-width="2"/>
<rect x="940" y="130" width="8" height="322" rx="4" fill="#f59e0b"/>
<text x="968" y="172" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#f59e0b">Ismail Hussein</text>
<text x="968" y="202" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">Ahli bahasa dan budayawan</text>
<text x="968" y="238" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">Dunia Melayu meliputi</text>
<text x="968" y="270" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">selatan Vietnam, Kemboja,</text>
<text x="968" y="302" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">selatan Myanmar, Segenting</text>
<text x="968" y="334" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">Kra, Malaysia, Indonesia,</text>
<text x="968" y="366" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">Brunei dan Filipina.</text>
<rect x="28" y="476" width="660" height="224" rx="16" fill="#162033" stroke="#334155" stroke-width="2"/>
<rect x="28" y="476" width="8" height="224" rx="4" fill="#f472b6"/>
<text x="56" y="518" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#f472b6">Alfred Russel Wallace</text>
<text x="56" y="548" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">Sarjana Barat</text>
<text x="56" y="584" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">Kepulauan Melayu meliputi Tanah Melayu</text>
<text x="56" y="616" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">hingga Tenasserim dan Kepulauan Nicobar,</text>
<text x="56" y="648" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">Filipina dan Kepulauan Solomon hingga Papua</text>
<text x="56" y="680" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">New Guinea.</text>
<rect x="712" y="476" width="660" height="224" rx="16" fill="#162033" stroke="#334155" stroke-width="2"/>
<rect x="712" y="476" width="8" height="224" rx="4" fill="#a78bfa"/>
<text x="740" y="518" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#a78bfa">Ding Choo Ming</text>
<text x="740" y="548" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">Pengkaji manuskrip Melayu</text>
<text x="740" y="584" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">Dunia Melayu merupakan sebuah kawasan yang</text>
<text x="740" y="616" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">luas meliputi Malaysia, Indonesia, Brunei,</text>
<text x="740" y="648" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">Singapura, selatan Thailand dan Filipina.</text>
</svg>
