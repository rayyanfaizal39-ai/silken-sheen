<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 876" width="760" height="876" role="img" aria-label="Perbandingan pandangan tokoh tentang kawasan Alam Melayu, bahagian 2 daripada 2">
<title>Pandangan Lima Tokoh tentang Kawasan Alam Melayu (2/2)</title>
<metadata>Rajah perbandingan. Sumber: buku teks hlm. 4-5.</metadata>
<rect width="760" height="876" rx="20" fill="#0f172a"/>
<text x="380" y="68" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#f1f5f9">Pandangan Lima Tokoh tentang</text>
<text x="380" y="116" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#f1f5f9">Kawasan Alam Melayu (2/2)</text>
<rect x="340" y="146" width="80" height="5" rx="2.5" fill="#38bdf8"/>
<rect x="28" y="178" width="704" height="192" rx="16" fill="#162033" stroke="#334155" stroke-width="2"/>
<rect x="28" y="178" width="8" height="192" rx="4" fill="#f472b6"/>
<text x="56" y="220" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#f472b6">Alfred Russel Wallace</text>
<text x="56" y="250" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">Sarjana Barat · hlm. 5</text>
<text x="56" y="286" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">Kepulauan Melayu meliputi Tanah Melayu hingga</text>
<text x="56" y="318" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">Tenasserim dan Kepulauan Nicobar, Filipina dan</text>
<text x="56" y="350" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">Kepulauan Solomon hingga Papua New Guinea.</text>
<rect x="28" y="382" width="704" height="192" rx="16" fill="#162033" stroke="#334155" stroke-width="2"/>
<rect x="28" y="382" width="8" height="192" rx="4" fill="#a78bfa"/>
<text x="56" y="424" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#a78bfa">Ding Choo Ming</text>
<text x="56" y="454" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">Pengkaji manuskrip Melayu · hlm. 5</text>
<text x="56" y="490" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">Dunia Melayu merupakan sebuah kawasan yang luas</text>
<text x="56" y="522" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">meliputi Malaysia, Indonesia, Brunei,</text>
<text x="56" y="554" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">Singapura, selatan Thailand dan Filipina.</text>
<rect x="28" y="586" width="704" height="162" rx="16" fill="#162033" stroke="#334155" stroke-width="2"/>
<rect x="28" y="586" width="8" height="162" rx="4" fill="#f1f5f9"/>
<text x="56" y="628" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#f1f5f9">Rumusan</text>
<text x="56" y="664" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">Pandangan tokoh hampir sama. Pada hari ini,</text>
<text x="56" y="696" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">Alam Melayu merupakan sebahagian daripada Asia</text>
<text x="56" y="728" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">Tenggara. (hlm. 5)</text>
<line x1="28" y1="758" x2="732" y2="758" stroke="#334155" stroke-width="2"/>
<text x="380" y="794" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#94a3b8">Rajah perbandingan berdasarkan buku teks hlm. 4-5 ·</text>
<text x="380" y="828" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#94a3b8">ilustrasi</text>
</svg>
