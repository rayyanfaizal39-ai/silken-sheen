<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 848" width="760" height="848" role="img" aria-label="Garis masa kemasyhuran dan kemerosotan kerajaan Alam Melayu, bahagian 1 daripada 2 (192 M - 1294)">
<title>Garis Masa Kemasyhuran dan Kemerosotan Kerajaan Alam Melayu (1/2)</title>
<metadata>Garis masa konseptual. Sumber: buku teks hlm. 9-13. Jarak antara tarikh tidak berskala.</metadata>
<rect width="760" height="848" rx="20" fill="#0f172a"/>
<text x="380" y="68" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#f1f5f9">Garis Masa Kemasyhuran dan</text>
<text x="380" y="116" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#f1f5f9">Kemerosotan Kerajaan Alam</text>
<text x="380" y="164" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#f1f5f9">Melayu (1/2)</text>
<rect x="340" y="194" width="80" height="5" rx="2.5" fill="#38bdf8"/>
<circle cx="40" cy="232" r="9" fill="#34d399"/><text x="58" y="240" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="500" fill="#cbd5e1">Pengasasan / kemasyhuran</text><circle cx="408" cy="232" r="9" fill="#fb7185"/><text x="426" y="240" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="500" fill="#cbd5e1">Kemerosotan</text>
<rect x="28" y="270" width="704" height="84" rx="12" fill="#162033" stroke="#334155" stroke-width="2"/><rect x="28" y="270" width="8" height="84" rx="4" fill="#34d399"/>
<text x="50" y="310" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" fill="#34d399">192 M</text>
<text x="50" y="340" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="500" fill="#94a3b8">hlm. 9</text>
<text x="200" y="312" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#f1f5f9">Champa diasaskan oleh Chu-Lien</text>
<rect x="28" y="362" width="704" height="92" rx="12" fill="#162033" stroke="#334155" stroke-width="2"/><rect x="28" y="362" width="8" height="92" rx="4" fill="#34d399"/>
<text x="50" y="402" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" fill="#34d399">683 M</text>
<text x="50" y="432" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="500" fill="#94a3b8">hlm. 10</text>
<text x="200" y="404" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#f1f5f9">Srivijaya diasaskan oleh Dapunta</text>
<text x="200" y="436" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#f1f5f9">Hyang Sri Jayanasa</text>
<rect x="28" y="462" width="704" height="124" rx="12" fill="#162033" stroke="#334155" stroke-width="2"/><rect x="28" y="462" width="8" height="124" rx="4" fill="#34d399"/>
<text x="50" y="502" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" fill="#34d399">850 M</text>
<text x="50" y="532" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="500" fill="#94a3b8">hlm. 13</text>
<text x="200" y="504" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#f1f5f9">Gangga Nagara mempertahankan</text>
<text x="200" y="536" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#f1f5f9">kedaulatan daripada serangan</text>
<text x="200" y="568" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#f1f5f9">Srivijaya</text>
<rect x="28" y="594" width="704" height="124" rx="12" fill="#162033" stroke="#334155" stroke-width="2"/><rect x="28" y="594" width="8" height="124" rx="4" fill="#fb7185"/>
<text x="50" y="634" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" fill="#fb7185">1025</text>
<text x="50" y="664" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="500" fill="#94a3b8">hlm. 10,</text>
<text x="50" y="690" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="500" fill="#94a3b8">12, 13</text>
<text x="200" y="636" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#f1f5f9">Serangan tentera Chola: Srivijaya,</text>
<text x="200" y="668" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#f1f5f9">Kedah Tua dan Gangga Nagara menjadi</text>
<text x="200" y="700" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#f1f5f9">lemah</text>
<rect x="28" y="726" width="704" height="92" rx="12" fill="#162033" stroke="#334155" stroke-width="2"/><rect x="28" y="726" width="8" height="92" rx="4" fill="#34d399"/>
<text x="50" y="766" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" fill="#34d399">1294</text>
<text x="50" y="796" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="500" fill="#94a3b8">hlm. 12</text>
<text x="200" y="768" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#f1f5f9">Majapahit diasaskan oleh Raden Vijaya</text>
<text x="200" y="800" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#f1f5f9">dengan bantuan tentera Mongol</text>
