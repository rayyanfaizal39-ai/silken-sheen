<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 844" width="760" height="844" role="img" aria-label="Perbandingan pandangan tokoh tentang kawasan Alam Melayu, bahagian 1 daripada 2">
<title>Pandangan Lima Tokoh tentang Kawasan Alam Melayu (1/2)</title>
<metadata>Rajah perbandingan. Sumber: buku teks hlm. 4-5.</metadata>
<rect width="760" height="844" rx="20" fill="#0f172a"/>
<text x="380" y="68" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#f1f5f9">Pandangan Lima Tokoh tentang</text>
<text x="380" y="116" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#f1f5f9">Kawasan Alam Melayu (1/2)</text>
<rect x="340" y="146" width="80" height="5" rx="2.5" fill="#38bdf8"/>
<rect x="28" y="178" width="704" height="224" rx="16" fill="#162033" stroke="#334155" stroke-width="2"/>
<rect x="28" y="178" width="8" height="224" rx="4" fill="#38bdf8"/>
<text x="56" y="220" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#38bdf8">Nik Hassan Shuhaimi Nik Abdul Rahman</text>
<text x="56" y="250" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">Ahli arkeologi · hlm. 4</text>
<text x="56" y="286" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">Alam Melayu meliputi kawasan dari Madagaskar ke</text>
<text x="56" y="318" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">Tanah Melayu, Papua New Guinea, Australia, New</text>
<text x="56" y="350" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">Zealand, Kepulauan Pasifik dan sampai ke</text>
<text x="56" y="382" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">Taiwan.</text>
<rect x="28" y="414" width="704" height="192" rx="16" fill="#162033" stroke="#334155" stroke-width="2"/>
<rect x="28" y="414" width="8" height="192" rx="4" fill="#34d399"/>
<text x="56" y="456" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#34d399">Abdul Hadi Haji Hassan</text>
<text x="56" y="486" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">Ahli akademik · hlm. 4</text>
<text x="56" y="522" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">Alam Melayu merupakan suatu lingkungan geografi</text>
<text x="56" y="554" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">yang luas meliputi Kepulauan Melayu hingga</text>
<text x="56" y="586" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">selatan Thailand.</text>
<rect x="28" y="618" width="704" height="192" rx="16" fill="#162033" stroke="#334155" stroke-width="2"/>
<rect x="28" y="618" width="8" height="192" rx="4" fill="#f59e0b"/>
<text x="56" y="660" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#f59e0b">Ismail Hussein</text>
<text x="56" y="690" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">Ahli bahasa dan budayawan · hlm. 5</text>
<text x="56" y="726" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">Dunia Melayu meliputi selatan Vietnam, Kemboja,</text>
<text x="56" y="758" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">selatan Myanmar, Segenting Kra, Malaysia,</text>
<text x="56" y="790" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">Indonesia, Brunei dan Filipina.</text>
</svg>
