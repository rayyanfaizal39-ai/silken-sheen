<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 776" width="760" height="776" role="img" aria-label="Garis masa kemasyhuran dan kemerosotan kerajaan Alam Melayu, bahagian 2 daripada 2 (1369 - 1594)">
<title>Garis Masa Kemasyhuran dan Kemerosotan Kerajaan Alam Melayu (2/2)</title>
<metadata>Garis masa konseptual. Sumber: buku teks hlm. 9-13. Jarak antara tarikh tidak berskala.</metadata>
<rect width="760" height="776" rx="20" fill="#0f172a"/>
<text x="380" y="68" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#f1f5f9">Garis Masa Kemasyhuran dan</text>
<text x="380" y="116" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#f1f5f9">Kemerosotan Kerajaan Alam</text>
<text x="380" y="164" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#f1f5f9">Melayu (2/2)</text>
<rect x="340" y="194" width="80" height="5" rx="2.5" fill="#38bdf8"/>
<circle cx="40" cy="232" r="9" fill="#34d399"/><text x="58" y="240" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="500" fill="#cbd5e1">Pengasasan / kemasyhuran</text><circle cx="408" cy="232" r="9" fill="#fb7185"/><text x="426" y="240" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="500" fill="#cbd5e1">Kemerosotan</text>
<rect x="28" y="270" width="704" height="92" rx="12" fill="#162033" stroke="#334155" stroke-width="2"/><rect x="28" y="270" width="8" height="92" rx="4" fill="#34d399"/>
<text x="50" y="310" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" fill="#34d399">1369</text>
<text x="200" y="312" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#f1f5f9">Champa (Che Bong Nga) mendapat</text>
<text x="200" y="344" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#f1f5f9">pengiktirafan Dinasti Ming</text>
<rect x="28" y="370" width="704" height="92" rx="12" fill="#162033" stroke="#334155" stroke-width="2"/><rect x="28" y="370" width="8" height="92" rx="4" fill="#fb7185"/>
<text x="50" y="410" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" fill="#fb7185">1441</text>
<text x="200" y="412" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#f1f5f9">Indravarman, pemerintah Champa,</text>
<text x="200" y="444" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#f1f5f9">meninggal dunia</text>
<rect x="28" y="470" width="704" height="84" rx="12" fill="#162033" stroke="#334155" stroke-width="2"/><rect x="28" y="470" width="8" height="84" rx="4" fill="#fb7185"/>
<text x="50" y="510" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" fill="#fb7185">1471</text>
<text x="200" y="512" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#f1f5f9">Champa ditawan oleh Dai Viet</text>
<rect x="28" y="562" width="704" height="92" rx="12" fill="#162033" stroke="#334155" stroke-width="2"/><rect x="28" y="562" width="8" height="92" rx="4" fill="#fb7185"/>
<text x="50" y="602" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" fill="#fb7185">1478</text>
<text x="200" y="604" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#f1f5f9">Serangan kerajaan Demak melemahkan</text>
<text x="200" y="636" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#f1f5f9">Majapahit</text>
<rect x="28" y="662" width="704" height="84" rx="12" fill="#162033" stroke="#334155" stroke-width="2"/><rect x="28" y="662" width="8" height="84" rx="4" fill="#fb7185"/>
<text x="50" y="702" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" fill="#fb7185">1594</text>
<text x="200" y="704" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#f1f5f9">Serangan Siam melemahkan Angkor</text>
</svg>
