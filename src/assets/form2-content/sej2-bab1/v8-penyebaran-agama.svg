<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 662" width="760" height="662" role="img" aria-label="Cara penyebaran agama Hindu, Buddha dan Islam ke Alam Melayu">
<title>Cara Penyebaran Agama ke Alam Melayu</title>
<metadata>Rajah perbandingan. Sumber: buku teks hlm. 17.</metadata>
<rect width="760" height="662" rx="20" fill="#0f172a"/>
<text x="380" y="68" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#f1f5f9">Cara Penyebaran Agama ke Alam</text>
<text x="380" y="116" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#f1f5f9">Melayu</text>
<rect x="340" y="146" width="80" height="5" rx="2.5" fill="#38bdf8"/>
<rect x="28" y="178" width="704" height="138" rx="16" fill="#162033" stroke="#334155" stroke-width="2"/>
<rect x="28" y="178" width="8" height="138" rx="4" fill="#f59e0b"/>
<text x="56" y="224" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#f59e0b">Hindu</text>
<text x="56" y="264" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#cbd5e1">Melalui peranan pedagang, tentera dan</text>
<text x="56" y="298" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#cbd5e1">golongan Brahmin.</text>
<rect x="28" y="332" width="704" height="138" rx="16" fill="#162033" stroke="#334155" stroke-width="2"/>
<rect x="28" y="332" width="8" height="138" rx="4" fill="#a78bfa"/>
<text x="56" y="378" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#a78bfa">Buddha</text>
<text x="56" y="418" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#cbd5e1">Peranan Asoka, pemerintah empayar Maurya,</text>
<text x="56" y="452" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#cbd5e1">menghantar sami-sami Buddha ke Alam Melayu.</text>
<rect x="28" y="486" width="704" height="138" rx="16" fill="#162033" stroke="#334155" stroke-width="2"/>
<rect x="28" y="486" width="8" height="138" rx="4" fill="#34d399"/>
<text x="56" y="532" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#34d399">Islam</text>
<text x="56" y="572" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#cbd5e1">Melalui peranan pedagang, pemerintah dan</text>
<text x="56" y="606" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#cbd5e1">pendakwah.</text>
</svg>
