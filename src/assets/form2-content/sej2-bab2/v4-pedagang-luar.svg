<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1274" width="760" height="1274" role="img" aria-label="Barangan yang dibawa dan dicari oleh pedagang China, India, Arab dan Parsi">
<title>Pedagang Luar di Alam Melayu</title>
<metadata>Rajah konseptual. Sumber: buku teks hlm. 31.</metadata>
<rect width="760" height="1274" rx="20" fill="#0f172a"/>
<text x="380" y="68" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#f1f5f9">Pedagang Luar di Alam Melayu</text>
<rect x="340" y="98" width="80" height="5" rx="2.5" fill="#38bdf8"/>
<rect x="28" y="130" width="704" height="360" rx="16" fill="#162033" stroke="#334155" stroke-width="2"/><rect x="28" y="130" width="8" height="360" rx="4" fill="#f87171"/>
<text x="52" y="172" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#f87171">Pedagang China</text>
<text x="52" y="217" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#94a3b8" letter-spacing="1">MEMBAWA KE ALAM MELAYU</text>
<circle cx="58" cy="251" r="5" fill="#f87171"/>
<text x="72" y="265" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#f1f5f9">Sutera, tembikar, pinggan dan</text>
<text x="72" y="305" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#f1f5f9">mangkuk, payung, gula, gendang</text>
<line x1="52" y1="325" x2="708" y2="325" stroke="#334155" stroke-width="2"/>
<text x="52" y="376" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#94a3b8" letter-spacing="1">MENCARI</text>
<text x="52" y="424" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#cbd5e1">Barangan Alam Melayu, terutama yang</text>
<text x="52" y="464" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#cbd5e1">mempunyai nilai perubatan</text>
<rect x="28" y="504" width="704" height="360" rx="16" fill="#162033" stroke="#334155" stroke-width="2"/><rect x="28" y="504" width="8" height="360" rx="4" fill="#fbbf24"/>
<text x="52" y="546" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#fbbf24">Pedagang India</text>
<text x="52" y="591" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#94a3b8" letter-spacing="1">MEMBAWA KE ALAM MELAYU</text>
<circle cx="58" cy="625" r="5" fill="#fbbf24"/>
<text x="72" y="639" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#f1f5f9">Kain kapas, tembikar, batu berharga</text>
<text x="72" y="679" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#f1f5f9">seperti akik dan karnelian</text>
<line x1="52" y1="699" x2="708" y2="699" stroke="#334155" stroke-width="2"/>
<text x="52" y="750" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#94a3b8" letter-spacing="1">MENDAPATKAN</text>
<text x="52" y="798" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#cbd5e1">Kain sutera dari China; rempah, gaharu</text>
<text x="52" y="838" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#cbd5e1">dan kapur barus dari Alam Melayu</text>
<rect x="28" y="878" width="704" height="360" rx="16" fill="#162033" stroke="#334155" stroke-width="2"/><rect x="28" y="878" width="8" height="360" rx="4" fill="#38bdf8"/>
<text x="52" y="920" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#38bdf8">Pedagang Arab dan Parsi</text>
<text x="52" y="965" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#94a3b8" letter-spacing="1">MEMBAWA KE ALAM MELAYU</text>
<circle cx="58" cy="999" r="5" fill="#38bdf8"/>
<text x="72" y="1013" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#f1f5f9">Tembikar, minyak wangi, barangan</text>
<text x="72" y="1053" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#f1f5f9">kaca, manik</text>
<line x1="52" y1="1073" x2="708" y2="1073" stroke="#334155" stroke-width="2"/>
<text x="52" y="1124" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#94a3b8" letter-spacing="1">MEMBELI</text>
<text x="52" y="1172" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#cbd5e1">Rempah dan kayu wangi untuk didagang</text>
<text x="52" y="1212" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#cbd5e1">semula ke Tanah Arab dan Rom</text>
</svg>
