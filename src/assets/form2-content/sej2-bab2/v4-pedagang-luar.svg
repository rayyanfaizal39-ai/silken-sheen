<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1068" width="760" height="1068" role="img" aria-label="Barangan yang dibawa dan dicari oleh pedagang China, India, Arab dan Parsi">
<title>Pedagang Luar di Alam Melayu</title>
<metadata>Rajah konseptual. Sumber: buku teks hlm. 31.</metadata>
<rect width="760" height="1068" rx="20" fill="#0f172a"/>
<text x="380" y="68" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#f1f5f9">Pedagang Luar di Alam Melayu</text>
<rect x="340" y="98" width="80" height="5" rx="2.5" fill="#38bdf8"/>
<rect x="28" y="130" width="704" height="302" rx="16" fill="#162033" stroke="#334155" stroke-width="2"/><rect x="28" y="130" width="8" height="302" rx="4" fill="#f87171"/>
<text x="52" y="172" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#f87171">Pedagang China</text>
<text x="52" y="204" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#94a3b8" letter-spacing="1">MEMBAWA KE ALAM MELAYU</text>
<circle cx="58" cy="234" r="5" fill="#f87171"/>
<text x="72" y="244" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#f1f5f9">Sutera, tembikar, pinggan dan mangkuk, payung,</text>
<text x="72" y="276" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#f1f5f9">gula, gendang</text>
<line x1="52" y1="296" x2="708" y2="296" stroke="#334155" stroke-width="2"/>
<text x="52" y="334" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#94a3b8" letter-spacing="1">MENCARI</text>
<text x="52" y="374" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#cbd5e1">Barangan Alam Melayu, terutama yang mempunyai nilai</text>
<text x="52" y="406" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#cbd5e1">perubatan</text>
<rect x="28" y="446" width="704" height="302" rx="16" fill="#162033" stroke="#334155" stroke-width="2"/><rect x="28" y="446" width="8" height="302" rx="4" fill="#fbbf24"/>
<text x="52" y="488" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#fbbf24">Pedagang India</text>
<text x="52" y="520" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#94a3b8" letter-spacing="1">MEMBAWA KE ALAM MELAYU</text>
<circle cx="58" cy="550" r="5" fill="#fbbf24"/>
<text x="72" y="560" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#f1f5f9">Kain kapas, tembikar, batu berharga seperti akik</text>
<text x="72" y="592" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#f1f5f9">dan karnelian</text>
<line x1="52" y1="612" x2="708" y2="612" stroke="#334155" stroke-width="2"/>
<text x="52" y="650" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#94a3b8" letter-spacing="1">MENDAPATKAN</text>
<text x="52" y="690" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#cbd5e1">Kain sutera dari China; rempah, gaharu dan kapur</text>
<text x="52" y="722" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#cbd5e1">barus dari Alam Melayu</text>
<rect x="28" y="762" width="704" height="270" rx="16" fill="#162033" stroke="#334155" stroke-width="2"/><rect x="28" y="762" width="8" height="270" rx="4" fill="#38bdf8"/>
<text x="52" y="804" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#38bdf8">Pedagang Arab dan Parsi</text>
<text x="52" y="836" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#94a3b8" letter-spacing="1">MEMBAWA KE ALAM MELAYU</text>
<circle cx="58" cy="866" r="5" fill="#38bdf8"/>
<text x="72" y="876" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#f1f5f9">Tembikar, minyak wangi, barangan kaca, manik</text>
<line x1="52" y1="896" x2="708" y2="896" stroke="#334155" stroke-width="2"/>
<text x="52" y="934" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#94a3b8" letter-spacing="1">MEMBELI</text>
<text x="52" y="974" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#cbd5e1">Rempah dan kayu wangi untuk didagang semula ke</text>
<text x="52" y="1006" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#cbd5e1">Tanah Arab dan Rom</text>
</svg>
