<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 582" width="1400" height="582" role="img" aria-label="Barangan yang dibawa dan dicari oleh pedagang China, India, Arab dan Parsi">
<title>Pedagang Luar di Alam Melayu</title>
<metadata>Rajah konseptual. Sumber: buku teks hlm. 31.</metadata>
<rect width="1400" height="582" rx="20" fill="#0f172a"/>
<text x="700" y="68" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#f1f5f9">Pedagang Luar di Alam Melayu</text>
<rect x="660" y="98" width="80" height="5" rx="2.5" fill="#38bdf8"/>
<rect x="28" y="130" width="432" height="430" rx="16" fill="#162033" stroke="#334155" stroke-width="2"/><rect x="28" y="130" width="8" height="430" rx="4" fill="#f87171"/>
<text x="52" y="172" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#f87171">Pedagang China</text>
<text x="52" y="204" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#94a3b8" letter-spacing="1">MEMBAWA KE ALAM MELAYU</text>
<circle cx="58.0" cy="234" r="5" fill="#f87171"/>
<text x="72" y="244" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#f1f5f9">Sutera</text>
<circle cx="58.0" cy="266" r="5" fill="#f87171"/>
<text x="72" y="276" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#f1f5f9">Tembikar</text>
<circle cx="58.0" cy="298" r="5" fill="#f87171"/>
<text x="72" y="308" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#f1f5f9">Pinggan dan mangkuk</text>
<circle cx="58.0" cy="330" r="5" fill="#f87171"/>
<text x="72" y="340" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#f1f5f9">Payung</text>
<circle cx="58.0" cy="362" r="5" fill="#f87171"/>
<text x="72" y="372" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#f1f5f9">Gula</text>
<circle cx="58.0" cy="394" r="5" fill="#f87171"/>
<text x="72" y="404" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#f1f5f9">Gendang</text>
<line x1="52.0" y1="424" x2="436.0" y2="424" stroke="#334155" stroke-width="2"/>
<text x="52" y="462" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#94a3b8" letter-spacing="1">MENCARI</text>
<text x="52" y="502" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#cbd5e1">Barangan Alam Melayu, terutama</text>
<text x="52" y="534" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#cbd5e1">yang mempunyai nilai perubatan</text>
<rect x="484" y="130" width="432" height="430" rx="16" fill="#162033" stroke="#334155" stroke-width="2"/><rect x="484" y="130" width="8" height="430" rx="4" fill="#fbbf24"/>
<text x="508" y="172" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#fbbf24">Pedagang India</text>
<text x="508" y="204" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#94a3b8" letter-spacing="1">MEMBAWA KE ALAM MELAYU</text>
<circle cx="514.0" cy="234" r="5" fill="#fbbf24"/>
<text x="528" y="244" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#f1f5f9">Kain kapas</text>
<circle cx="514.0" cy="266" r="5" fill="#fbbf24"/>
<text x="528" y="276" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#f1f5f9">Tembikar</text>
<circle cx="514.0" cy="298" r="5" fill="#fbbf24"/>
<text x="528" y="308" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#f1f5f9">Batu berharga seperti akik</text>
<text x="528" y="340" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#f1f5f9">dan karnelian</text>
<line x1="508.0" y1="360" x2="892.0" y2="360" stroke="#334155" stroke-width="2"/>
<text x="508" y="398" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#94a3b8" letter-spacing="1">MENDAPATKAN</text>
<text x="508" y="438" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#cbd5e1">Kain sutera dari China;</text>
<text x="508" y="470" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#cbd5e1">rempah, gaharu dan kapur barus</text>
<text x="508" y="502" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#cbd5e1">dari Alam Melayu</text>
<rect x="940" y="130" width="432" height="430" rx="16" fill="#162033" stroke="#334155" stroke-width="2"/><rect x="940" y="130" width="8" height="430" rx="4" fill="#38bdf8"/>
<text x="964" y="172" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#38bdf8">Pedagang Arab dan Parsi</text>
<text x="964" y="204" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#94a3b8" letter-spacing="1">MEMBAWA KE ALAM MELAYU</text>
<circle cx="970.0" cy="234" r="5" fill="#38bdf8"/>
<text x="984" y="244" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#f1f5f9">Tembikar</text>
<circle cx="970.0" cy="266" r="5" fill="#38bdf8"/>
<text x="984" y="276" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#f1f5f9">Minyak wangi</text>
<circle cx="970.0" cy="298" r="5" fill="#38bdf8"/>
<text x="984" y="308" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#f1f5f9">Barangan kaca</text>
<circle cx="970.0" cy="330" r="5" fill="#38bdf8"/>
<text x="984" y="340" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#f1f5f9">Manik</text>
<line x1="964.0" y1="360" x2="1348.0" y2="360" stroke="#334155" stroke-width="2"/>
<text x="964" y="398" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#94a3b8" letter-spacing="1">MEMBELI</text>
<text x="964" y="438" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#cbd5e1">Rempah dan kayu wangi untuk</text>
<text x="964" y="470" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#cbd5e1">didagang semula ke Tanah Arab</text>
<text x="964" y="502" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#cbd5e1">dan Rom</text>
</svg>
