<text x="810" y="158" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#f59e0b">Kedah — sekitar 630 M</text>
<text x="810" y="192" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#cbd5e1">Maharaja Derbar Raja dari Parsi tiba di</text>
<text x="810" y="232" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#cbd5e1">Kuala Sungai Merbok; pusat kerajaan di</text>
<text x="810" y="272" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#cbd5e1">Sungai Mas.</text>
<circle cx="782" cy="316" r="17" fill="#0f172a" stroke="#34d399" stroke-width="2.5"/><text x="782" y="324" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">2</text>
<text x="810" y="326" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#34d399">Kelantan — 1762</text>
<text x="810" y="360" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#cbd5e1">Long Yunus menyatukan Kelantan Barat dan</text>
<text x="810" y="400" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#cbd5e1">Timur; pusat dipindahkan ke Kota Galoh pada</text>
<text x="810" y="440" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#cbd5e1">1777.</text>
<circle cx="782" cy="484" r="17" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/><text x="782" y="492" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">3</text>
<text x="810" y="494" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#38bdf8">Negeri Sembilan — 1773</text>
<text x="810" y="528" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#cbd5e1">Raja Melewar diutus dari Minangkabau;</text>
<text x="810" y="568" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#cbd5e1">berpusat di Seri Menanti.</text>
<circle cx="782" cy="612" r="17" fill="#0f172a" stroke="#fb7185" stroke-width="2.5"/><text x="782" y="620" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">4</text>
<text x="810" y="622" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#fb7185">Perlis — 1843</text>
<text x="810" y="656" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#cbd5e1">Syed Hussin Jamalullail diiktiraf Siam; Arau</text>
<text x="810" y="696" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#cbd5e1">dijadikan pusat pentadbiran.</text>
