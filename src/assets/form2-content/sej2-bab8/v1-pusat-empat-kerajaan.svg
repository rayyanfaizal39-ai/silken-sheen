<rect x="28" y="226" width="704" height="1110" rx="14" fill="none" stroke="#334155" stroke-width="2"/>
<circle cx="46" cy="1378" r="17" fill="#0f172a" stroke="#f59e0b" stroke-width="2.5"/><text x="46" y="1386" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">1</text>
<text x="74" y="1388" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#f59e0b">Kedah — sekitar 630 M</text>
<text x="74" y="1422" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">Maharaja Derbar Raja dari Parsi tiba di Kuala Sungai</text>
<text x="74" y="1452" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">Merbok; pusat kerajaan di Sungai Mas.</text>
<circle cx="46" cy="1486" r="17" fill="#0f172a" stroke="#34d399" stroke-width="2.5"/><text x="46" y="1494" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">2</text>
<text x="74" y="1496" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#34d399">Kelantan — 1762</text>
<text x="74" y="1530" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">Long Yunus menyatukan Kelantan Barat dan Timur; pusat</text>
<text x="74" y="1560" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">dipindahkan ke Kota Galoh pada 1777.</text>
<circle cx="46" cy="1594" r="17" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/><text x="46" y="1602" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">3</text>
<text x="74" y="1604" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#38bdf8">Negeri Sembilan — 1773</text>
<text x="74" y="1638" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">Raja Melewar diutus dari Minangkabau; berpusat di Seri</text>
<text x="74" y="1668" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">Menanti.</text>
<circle cx="46" cy="1702" r="17" fill="#0f172a" stroke="#fb7185" stroke-width="2.5"/><text x="46" y="1710" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">4</text>
<text x="74" y="1712" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#fb7185">Perlis — 1843</text>
<text x="74" y="1746" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">Syed Hussin Jamalullail diiktiraf Siam; Arau dijadikan</text>
<text x="74" y="1776" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">pusat pentadbiran.</text>
