<text x="74" y="1410" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#f59e0b">Kedah — sekitar 630 M</text>
<text x="74" y="1452" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#cbd5e1">Maharaja Derbar Raja dari Parsi tiba</text>
<text x="74" y="1492" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#cbd5e1">di Kuala Sungai Merbok; pusat kerajaan</text>
<text x="74" y="1532" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#cbd5e1">di Sungai Mas.</text>
<circle cx="46" cy="1572" r="21" fill="#0f172a" stroke="#34d399" stroke-width="2.5"/><text x="46" y="1583" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#f1f5f9">2</text>
<text x="74" y="1582" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#34d399">Kelantan — 1762</text>
<text x="74" y="1624" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#cbd5e1">Long Yunus menyatukan Kelantan Barat</text>
<text x="74" y="1664" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#cbd5e1">dan Timur; pusat dipindahkan ke Kota</text>
<text x="74" y="1704" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#cbd5e1">Galoh pada 1777.</text>
<circle cx="46" cy="1744" r="21" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/><text x="46" y="1755" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#f1f5f9">3</text>
<text x="74" y="1754" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#38bdf8">Negeri Sembilan — 1773</text>
<text x="74" y="1796" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#cbd5e1">Raja Melewar diutus dari Minangkabau;</text>
<text x="74" y="1836" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#cbd5e1">berpusat di Seri Menanti.</text>
<circle cx="46" cy="1876" r="21" fill="#0f172a" stroke="#fb7185" stroke-width="2.5"/><text x="46" y="1887" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#f1f5f9">4</text>
<text x="74" y="1886" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#fb7185">Perlis — 1843</text>
<text x="74" y="1928" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#cbd5e1">Syed Hussin Jamalullail diiktiraf</text>
<text x="74" y="1968" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#cbd5e1">Siam; Arau dijadikan pusat</text>
<text x="74" y="2008" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#cbd5e1">pentadbiran.</text>
