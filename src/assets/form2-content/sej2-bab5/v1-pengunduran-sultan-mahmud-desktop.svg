<rect x="28" y="130" width="780" height="632" rx="14" fill="none" stroke="#334155" stroke-width="2"/>
<circle cx="866" cy="148" r="17" fill="#0f172a" stroke="#fb7185" stroke-width="2.5"/><text x="866" y="156" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">1</text>
<text x="894" y="158" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#fb7185">25 Julai – 24 Ogos 1511</text>
<text x="894" y="192" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#cbd5e1">Tiga serangan Portugis; Melaka jatuh</text>
<text x="894" y="224" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#cbd5e1">pada 24 Ogos 1511.</text>
<circle cx="866" cy="260" r="17" fill="#0f172a" stroke="#f59e0b" stroke-width="2.5"/><text x="866" y="268" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">2</text>
<text x="894" y="270" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#f59e0b">Selepas 1511</text>
<text x="894" y="304" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#cbd5e1">Sultan Mahmud Shah berundur ke</text>
<text x="894" y="336" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#cbd5e1">wilayah naungan dan jajahan,</text>
<text x="894" y="368" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#cbd5e1">kemudian bersemayam di Bentan.</text>
<circle cx="866" cy="404" r="17" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/><text x="866" y="412" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">3</text>
<text x="894" y="414" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#38bdf8">1515 – 1519</text>
<text x="894" y="448" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#cbd5e1">Tiga kali serangan untuk mendapatkan</text>
<text x="894" y="480" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#cbd5e1">semula Melaka, tetapi gagal.</text>
<circle cx="866" cy="516" r="17" fill="#0f172a" stroke="#fb7185" stroke-width="2.5"/><text x="866" y="524" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">4</text>
<text x="894" y="526" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#fb7185">1526</text>
<text x="894" y="560" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#cbd5e1">Pusat pemerintahan di Bentan</text>
<text x="894" y="592" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#cbd5e1">dimusnahkan oleh Portugis.</text>
<circle cx="866" cy="628" r="17" fill="#0f172a" stroke="#34d399" stroke-width="2.5"/><text x="866" y="636" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">5</text>
<text x="894" y="638" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#34d399">1528</text>
<text x="894" y="672" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#cbd5e1">Sultan Mahmud Shah berundur ke</text>
<text x="894" y="704" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#cbd5e1">Kampar dan mangkat.</text>
</svg>
