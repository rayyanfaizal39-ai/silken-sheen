<rect x="28" y="178" width="704" height="571" rx="14" fill="none" stroke="#334155" stroke-width="2"/>
<circle cx="46" cy="791" r="17" fill="#0f172a" stroke="#fb7185" stroke-width="2.5"/><text x="46" y="799" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">1</text>
<text x="74" y="801" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#fb7185">25 Julai – 24 Ogos 1511</text>
<text x="74" y="835" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#cbd5e1">Tiga serangan Portugis; Melaka jatuh pada 24 Ogos</text>
<text x="74" y="867" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#cbd5e1">1511.</text>
<circle cx="46" cy="903" r="17" fill="#0f172a" stroke="#f59e0b" stroke-width="2.5"/><text x="46" y="911" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">2</text>
<text x="74" y="913" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#f59e0b">Selepas 1511</text>
<text x="74" y="947" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#cbd5e1">Sultan Mahmud Shah berundur ke wilayah naungan dan</text>
<text x="74" y="979" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#cbd5e1">jajahan, kemudian bersemayam di Bentan.</text>
<circle cx="46" cy="1015" r="17" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/><text x="46" y="1023" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">3</text>
<text x="74" y="1025" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#38bdf8">1515 – 1519</text>
<text x="74" y="1059" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#cbd5e1">Tiga kali serangan untuk mendapatkan semula</text>
<text x="74" y="1091" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#cbd5e1">Melaka, tetapi gagal.</text>
<circle cx="46" cy="1127" r="17" fill="#0f172a" stroke="#fb7185" stroke-width="2.5"/><text x="46" y="1135" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">4</text>
<text x="74" y="1137" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#fb7185">1526</text>
<text x="74" y="1171" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#cbd5e1">Pusat pemerintahan di Bentan dimusnahkan oleh</text>
<text x="74" y="1203" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#cbd5e1">Portugis.</text>
<circle cx="46" cy="1239" r="17" fill="#0f172a" stroke="#34d399" stroke-width="2.5"/><text x="46" y="1247" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">5</text>
<text x="74" y="1249" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#34d399">1528</text>
<text x="74" y="1283" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#cbd5e1">Sultan Mahmud Shah berundur ke Kampar dan mangkat.</text>
</svg>
