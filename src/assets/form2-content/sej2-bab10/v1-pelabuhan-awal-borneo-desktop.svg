<text x="1160" y="398" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#fb7185">Santubong — abad ketujuh</text>
<text x="1160" y="432" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#cbd5e1">Pusat perdagangan utama Sarawak; tembikar</text>
<text x="1160" y="468" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#cbd5e1">Dinasti T’ang dan Sung ditemukan.</text>
<circle cx="1132" cy="508" r="17" fill="#0f172a" stroke="#34d399" stroke-width="2.5"/><text x="1132" y="516" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">4</text>
<text x="1160" y="518" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#34d399">Gedong, Bukit Sandong, Kalka</text>
<text x="1160" y="552" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#cbd5e1">Pusat perdagangan lain di Sarawak (Bukit</text>
<text x="1160" y="588" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#cbd5e1">Sandong tidak ditanda).</text>
<circle cx="1132" cy="628" r="17" fill="#0f172a" stroke="#a78bfa" stroke-width="2.5"/><text x="1132" y="636" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">5</text>
<text x="1160" y="638" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#a78bfa">Pulau Banggi dan Limbang</text>
<text x="1160" y="672" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#cbd5e1">Gendang gangsa jenis Moko (Majapahit) di Pulau</text>
<text x="1160" y="708" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#cbd5e1">Banggi; patung Ganesha di Limbang.</text>
