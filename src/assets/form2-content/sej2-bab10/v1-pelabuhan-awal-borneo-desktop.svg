<text x="1160" y="158" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#f59e0b">Bukit Tengkorak — sebelum Masihi</text>
<text x="1160" y="192" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#cbd5e1">Pusat pembuatan tembikar di Semporna; berdagang</text>
<text x="1160" y="228" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#cbd5e1">dengan kawasan luar Sabah.</text>
