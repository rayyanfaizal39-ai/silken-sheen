<text x="1160" y="278" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#38bdf8">Chu-Po — abad ketiga</text>
<text x="1160" y="312" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#cbd5e1">Pelabuhan di utara Sabah; mengeksport besi ke</text>
<text x="1160" y="348" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#cbd5e1">Funan dan Champa.</text>
