<text x="74" y="1066" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">Rajang, Balui, Baram dan Hulu Kemena.</text>
<circle cx="46" cy="1100" r="17" fill="#0f172a" stroke="#f59e0b" stroke-width="2.5"/><text x="46" y="1108" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">5</text>
<text x="74" y="1110" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#f59e0b">Kadazandusun</text>
<text x="74" y="1144" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">Penampang, Papar, Tuaran, Tambunan dan Ranau.</text>
<circle cx="46" cy="1178" r="17" fill="#0f172a" stroke="#fb7185" stroke-width="2.5"/><text x="46" y="1186" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">6</text>
<text x="74" y="1188" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#fb7185">Murut</text>
<text x="74" y="1222" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">Kawasan Tenom hingga Kalabakan.</text>
<circle cx="46" cy="1256" r="17" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/><text x="46" y="1264" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">7</text>
