<rect x="28" y="178" width="704" height="478" rx="14" fill="none" stroke="#334155" stroke-width="2"/>
<circle cx="46" cy="698" r="17" fill="#0f172a" stroke="#f59e0b" stroke-width="2.5"/><text x="46" y="706" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">1</text>
<text x="74" y="708" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#f59e0b">Iban</text>
<text x="74" y="742" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">Dari Sungai Kapuas; menetap di hulu Batang Lupar,</text>
<text x="74" y="772" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">Sungai Rajang hingga Sungai Baram.</text>
<circle cx="46" cy="806" r="17" fill="#0f172a" stroke="#fb7185" stroke-width="2.5"/><text x="46" y="814" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">2</text>
<text x="74" y="816" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#fb7185">Bidayuh</text>
<text x="74" y="850" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">Dari Sungkung, Kalimantan; berhijrah ke selatan</text>
<text x="74" y="880" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">Sarawak.</text>
<circle cx="46" cy="914" r="17" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/><text x="46" y="922" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">3</text>
<text x="74" y="924" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#38bdf8">Melanau</text>
<text x="74" y="958" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">Mendiami kawasan tengah Sarawak sejak dahulu.</text>
<circle cx="46" cy="992" r="17" fill="#0f172a" stroke="#34d399" stroke-width="2.5"/><text x="46" y="1000" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">4</text>
