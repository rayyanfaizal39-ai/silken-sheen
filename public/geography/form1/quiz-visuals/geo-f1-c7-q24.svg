<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title description">
  <title id="title">Likuan sungai terpenggal</title>
  <desc id="description">Sungai berliku dengan aliran pintasan yang bersambung ke sungai di kedua-dua hujung. Likuan lama masih bersambung; proses seterusnya tidak ditunjukkan.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111f38"/><stop offset="1" stop-color="#091528"/></linearGradient></defs>
  <rect x="2" y="2" width="716" height="356" rx="22" fill="url(#bg)" stroke="#35506d" stroke-width="3"/>
  
  <!-- The old loop and the shortcut share both junctions (280,115), (440,115). -->
  <path id="river-banks" d="M60 115H280 C220 155 210 290 360 290 C510 290 500 155 440 115 H660" stroke="#d8c8a4" stroke-width="66" stroke-linecap="round" fill="none"/>
  <path id="river-channel" d="M60 115H280 C220 155 210 290 360 290 C510 290 500 155 440 115 H660" stroke="#2979a6" stroke-width="38" stroke-linecap="round" fill="none"/>
  <path id="cutoff" d="M280 115H440" stroke="#9dddf5" stroke-width="28" stroke-linecap="round" fill="none"/>
  <path d="M343 105L360 115L343 125 M615 104L632 115L615 126" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linejoin="round"/>
  <g font-family="Arial,sans-serif" fill="#f8fafc" font-size="36"><text x="28" y="52">Aliran sungai</text><text x="416" y="52">Aliran pintasan</text></g>
  <path d="M490 64L385 100" stroke="#fbbf24" stroke-width="3"/>
</svg>
