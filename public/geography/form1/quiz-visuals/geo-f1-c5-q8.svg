<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title description">
  <title id="title">Keratan rentas struktur bumi</title>
  <desc id="description">Tiga lapisan utama struktur Bumi ditunjukkan secara skematik tanpa nama: lapisan nipis luar, lapisan tebal tengah, dan teras di pusat.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111f38"/><stop offset="1" stop-color="#091528"/></linearGradient></defs>
  <rect x="2" y="2" width="716" height="356" rx="22" fill="url(#bg)" stroke="#35506d" stroke-width="3"/>
  
  <circle cx="358" cy="180" r="151" fill="#dbd2a1" stroke="#f3e3b3" stroke-width="5"/>
  <circle cx="358" cy="180" r="139" fill="#c5653b"/>
  <circle cx="358" cy="180" r="61" fill="#f4ad40"/>
  
  <path d="M205 80L145 54H87 M247 250L159 293H87 M360 180L539 180H631" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="5 5"/>
  <g font-family="Arial,sans-serif" font-size="20" fill="#f8fafc"><text x="85" y="45">Lapisan luar</text><text x="87" y="319">Lapisan tengah</text><text x="557" y="167">Bahagian pusat</text></g>
  <text x="40" y="346" font-family="Arial,sans-serif" fill="#94a3b8" font-size="17">Keratan rentas skematik • tidak mengikut skala</text>

</svg>
