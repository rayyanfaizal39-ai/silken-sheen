<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title description">
  <title id="title">Keratan rentas struktur bumi</title>
  <desc id="description">Keratan rentas Bumi: lapisan luar nipis, lapisan tengah tebal dan bahagian pusat. Rajah skematik, tidak mengikut skala.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111f38"/><stop offset="1" stop-color="#091528"/></linearGradient></defs>
  <rect x="2" y="2" width="716" height="356" rx="22" fill="url(#bg)" stroke="#35506d" stroke-width="3"/>
  
  <circle cx="358" cy="180" r="151" fill="#dbd2a1" stroke="#f3e3b3" stroke-width="5"/>
  <circle cx="358" cy="180" r="139" fill="#c5653b"/>
  <circle cx="358" cy="180" r="61" fill="#f4ad40"/>
  
  <path d="M240 96L175 54H30 M247 250L159 293H30 M360 180H560" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="5 5"/>
  <g font-family="Arial,sans-serif" font-size="36" fill="#f8fafc"><text x="24" y="42">Lapisan luar</text><text x="24" y="332">Lapisan tengah</text><text x="530" y="126"><tspan x="530">Bahagian</tspan><tspan x="530" dy="44">pusat</tspan></text></g>
</svg>
