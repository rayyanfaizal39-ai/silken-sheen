<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title description">
  <title id="title">Ciri pada peta lakar</title>
  <desc id="description">Peta lakar menunjukkan satu sungai biru berliku, sebuah masjid sebagai tanda tempat, dan kawasan ladang kelapa sawit berlorek. Jenis simbol tidak dinamakan.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111f38"/><stop offset="1" stop-color="#091528"/></linearGradient></defs>
  <rect x="2" y="2" width="716" height="356" rx="22" fill="url(#bg)" stroke="#35506d" stroke-width="3"/>
  
  <rect x="68" y="42" width="580" height="269" rx="14" fill="#e5ecdc" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M145 57C206 95 155 154 212 194S272 257 228 298" fill="none" stroke="#3394d1" stroke-width="22" stroke-linecap="round"/>
  <path d="M143 57C204 95 153 154 210 194S270 257 226 298" fill="none" stroke="#bfebff" stroke-width="6" stroke-linecap="round"/>
  <rect x="346" y="138" width="252" height="130" rx="9" fill="#a2c78b" stroke="#47734f" stroke-width="3"/>
  <g fill="#59875e"><circle cx="375" cy="165" r="10"/><circle cx="422" cy="165" r="10"/><circle cx="469" cy="165" r="10"/><circle cx="516" cy="165" r="10"/><circle cx="562" cy="165" r="10"/><circle cx="375" cy="203" r="10"/><circle cx="422" cy="203" r="10"/><circle cx="469" cy="203" r="10"/><circle cx="516" cy="203" r="10"/><circle cx="562" cy="203" r="10"/></g>
  <circle cx="373" cy="90" r="13" fill="#c28a34" stroke="#263b42" stroke-width="4"/>
  <g fill="#1b3444" font-family="Arial,sans-serif" font-size="21" font-weight="bold"><text x="401" y="98">Masjid</text><text x="314" y="296">Ladang kelapa sawit</text><text x="82" y="142">Sungai</text></g>
  <g font-family="Arial,sans-serif" font-size="18" fill="#e2e8f0"><text x="68" y="336">Tentukan jenis simbol bagi setiap ciri.</text></g>

</svg>
