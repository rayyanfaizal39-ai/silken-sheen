<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title description">
  <title id="title">Bearing sudutan 225 darjah</title>
  <desc id="description">Kompas dengan arah Utara, Timur, Selatan dan Barat. Satu anak panah ditunjukkan pada bearing 225 darjah tanpa menulis jawapan arah.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111f38"/><stop offset="1" stop-color="#091528"/></linearGradient></defs>
  <rect x="2" y="2" width="716" height="356" rx="22" fill="url(#bg)" stroke="#35506d" stroke-width="3"/>
  
  <circle cx="355" cy="180" r="132" fill="#0f2b44" stroke="#355876" stroke-width="3"/>
  <circle cx="355" cy="180" r="93" fill="none" stroke="#50728b" stroke-width="2" stroke-dasharray="5 9"/>
  <path d="M355 65V295 M240 180H470" stroke="#4a6682" stroke-width="2"/>
  <path d="M355 180L298 237" stroke="#fbbf24" stroke-width="9" stroke-linecap="round"/>
  <path d="M276 258L288 226L307 247Z" fill="#fbbf24"/>
  <circle cx="355" cy="180" r="11" fill="#fbbf24"/>
  <g font-family="Arial,sans-serif" font-size="29" font-weight="bold" text-anchor="middle" fill="#f8fafc">
    <text x="355" y="38">U</text><text x="498" y="190">T</text><text x="355" y="335">S</text><text x="212" y="190">B</text>
  </g>
  <g font-family="Arial,sans-serif" font-size="22" fill="#fbbf24"><text x="90" y="65">Bearing 225°</text><text x="90" y="94" font-size="17" fill="#cbd5e1">Diukur dari Utara mengikut arah jam</text></g>

</svg>
